    <style>
        /* Styles spécifiques pour la grille de la boutique */
        .boutique-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 40px 20px;
        }

        .produit-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 300px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .produit-card h3 {
            margin-top: 15px;
            font-size: 1.4rem;
        }

        .produit-prix {
            font-size: 1.6rem;
            font-weight: bold;
            color: #333;
            margin: 15px 0;
        }

        .produit-card p {
            font-size: 0.95rem;
            height: 60px;
            /* Aligne les boutons si les textes ont des longueurs différentes */
        }
    </style>
